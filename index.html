html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;font-size:15.5px;line-height:1.85;font-feature-settings:"ss01"}
.ic{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.2em}
a{color:var(--blue)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
strong{font-weight:700}
.skip{position:absolute;right:12px;top:-60px;background:var(--blue);color:#fff;padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{top:12px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(16,34,58,.92);backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.bar-in{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:15px;white-space:nowrap}
.brand .ic{width:28px;height:28px;padding:5px;border-radius:8px;background:linear-gradient(135deg,#2b62e0,#0e9f8a);color:#fff}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{color:#b9c7da;text-decoration:none;font-size:13.5px;padding:6px 11px;border-radius:999px;white-space:nowrap}
.links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.links a[aria-current]{color:#fff;background:rgba(255,255,255,.14)}
.upd{display:flex;align-items:center;gap:6px;color:#8fa3bd;font-size:12.5px;white-space:nowrap}

/* hero */
.hero{background:
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/22px 22px,
  radial-gradient(1200px 500px at 85% -10%,#24508f 0%,transparent 60%),
  linear-gradient(180deg,var(--navy) 0%,#0d1c31 100%);
  color:#fff;padding:52px 0 0}
.hero-in{max-width:1200px;margin:0 auto;padding:0 24px}
.hero-head{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;align-items:start}
.kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13.5px;color:#9fd9cf;background:rgba(14,159,138,.14);border:1px solid rgba(14,159,138,.35);padding:4px 12px 4px 14px;border-radius:999px}
.hero h1{font-size:clamp(28px,3.9vw,44px);line-height:1.4;font-weight:900;margin:0 0 16px;letter-spacing:-.3px;max-width:24ch}
.lead{font-size:16.5px;line-height:1.95;color:#c4d1e2;margin:0;max-width:62ch}
.clock{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-lg);padding:18px 16px 14px;text-align:center;position:relative}
.ring{width:132px;height:132px;transform:rotate(-90deg) scaleY(-1)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:rgba(255,255,255,.1)}
.ring-fg{stroke:#2fd0b4;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.clock-txt{position:absolute;top:40px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.clock-txt b{font-size:40px;font-weight:900;line-height:1.1}
.clock-txt span{font-size:12.5px;color:#9fb1c8}
.clock-cap{margin:8px 0 0;font-size:13px;color:#c4d1e2}

.target{margin-top:40px;background:var(--card);color:var(--ink);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:28px 28px 22px;box-shadow:0 -20px 50px rgba(5,12,24,.25);position:relative}
.tg-nums{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:0;margin-bottom:22px}
.tg{padding:0 22px;border-left:1px solid var(--line)}
.tg:first-child{padding-right:0}
.tg:last-child{border-left:0}
.tg-l{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.tg-l .ic{color:var(--ink-3)}
.tg-n{display:block;font-size:clamp(26px,3.4vw,40px);font-weight:900;line-height:1.3;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tg-main .tg-n{color:var(--ink)}
.tg-done .tg-n,.tg-done .tg-l .ic{color:var(--done)}
.tg-pct .tg-n{color:var(--blue)}
.tg-pct .tg-l .ic{color:var(--blue)}
.meter{display:grid;grid-template-columns:repeat(85,1fr);gap:3px;direction:rtl}
.sg{display:block;height:34px;border-radius:3px;transform-origin:bottom;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.sg.done{background:var(--done)}
.sg.apn{background:var(--apn)}
.sg.ware{background:var(--ware)}
.sg.fail{background:var(--fail-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fail) 55%,transparent)}
@keyframes rise{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.meter-key{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--ink-2)}
.meter-key li{display:flex;align-items:center;gap:7px}
.meter-key .unit{color:var(--ink-3);margin-inline-start:auto}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.done{background:var(--done)} .sw.apn{background:var(--apn)} .sw.ware{background:var(--ware)}
.sw.fail{background:var(--fail-soft);box-shadow:inset 0 0 0 1.5px var(--fail)}

/* main + section scaffold */
main{max-width:1200px;margin:0 auto;padding:0 24px 40px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 32px;margin-top:24px}
#route{margin-top:0;border-top:0;border-radius:0 0 var(--r-lg) var(--r-lg);border-top:1px solid var(--line)}
.sec-h{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}
.sec-ic{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.sec-ic .ic{width:22px;height:22px}
.sec h2{margin:0;font-size:22px;font-weight:800;line-height:1.5}
.sec-sub{margin:2px 0 0;color:var(--ink-2);font-size:14.5px;max-width:78ch}
h3{font-size:16px;font-weight:800;margin:0}
p{margin:0}

/* notes */
.note{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--blue-soft);color:var(--ink)}
.note .ic{color:var(--blue);margin-top:5px}
.note.quiet{background:var(--card-2);border:1px solid var(--line)}
.note.quiet .ic{color:var(--ink-3)}
.note.warn{background:var(--apn-soft)}
.note.warn .ic{color:var(--apn)}
.foot{font-size:13.5px;color:var(--ink-2);margin-top:10px}

/* route */
.route-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:center}
.donut{width:100%;max-width:260px;display:block;margin:0 auto}
.dn,.dn-bg{fill:none;stroke-width:26}
.dn-bg{stroke:var(--card-2)}
.dn.done{stroke:var(--done)} .dn.fail{stroke:var(--fail)} .dn.apn{stroke:var(--apn)} .dn.ware{stroke:var(--ware)}
.donut{transform:scaleX(-1)}
.donut text{transform:scaleX(-1);transform-origin:100px 100px;text-anchor:middle;fill:var(--ink)}
.dn-n{font-size:25px;font-weight:900;font-family:inherit}
.dn-l{font-size:12px;fill:var(--ink-3)!important;font-family:inherit}
.donut-wrap{margin:0}
.routes{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rt{display:flex;gap:14px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card)}
.rt-ic{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center}
.rt-ic .ic{width:21px;height:21px}
.rt.done .rt-ic{background:var(--done-soft);color:var(--done)}
.rt.fail .rt-ic{background:var(--fail-soft);color:var(--fail)}
.rt.apn .rt-ic{background:var(--apn-soft);color:var(--apn)}
.rt.ware .rt-ic{background:var(--ware-soft);color:var(--ware)}
.rt-b{flex:1;min-width:0}
.rt-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rt-h b{font-size:15px}
.rt-n{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt-n{display:flex;align-items:baseline;gap:10px}
.rt-n small{font-weight:600;font-size:12.5px;color:var(--ink-3);background:var(--card-2);padding:0 8px;border-radius:99px}
.rt-bar{height:6px;border-radius:99px;background:var(--card-2);margin:6px 0 8px;overflow:hidden}
.rt-bar i{display:block;height:100%;border-radius:99px}
.rt.done .rt-bar i{background:var(--done)} .rt.fail .rt-bar i{background:var(--fail)}
.rt.apn .rt-bar i{background:var(--apn)} .rt.ware .rt-bar i{background:var(--ware)}
.rt p{font-size:13.5px;color:var(--ink-2);line-height:1.75}

/* gantt */
.gantt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.gantt{display:grid;grid-template-columns:230px repeat(var(--days),minmax(32px,1fr));min-width:980px;position:relative}
.g-corner{grid-column:1;border-bottom:1px solid var(--line);background:var(--card-2)}
.gw{grid-row:1;font-size:12px;font-weight:700;color:var(--ink-2);padding:6px 10px;background:var(--card-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gd{grid-row:2;display:flex;flex-direction:column;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);background:var(--card-2);font-size:11.5px;color:var(--ink-3);line-height:1.4}
.gd b{font-size:13px;color:var(--ink);font-weight:700}
.gd.wk{color:var(--ink-3);background:color-mix(in srgb,var(--card-2) 60%,var(--line))}
.gd.today{background:var(--blue);color:#fff}
.gd.today b{color:#fff}
.gg{grid-row:3;display:flex;justify-content:center;align-items:center;height:34px;border-bottom:1px dashed var(--line);position:relative}
.gg i{width:14px;height:14px;transform:rotate(45deg);background:var(--navy);border-radius:2px}
.gg span{position:absolute;color:#fff;font-size:10px;font-weight:800}
.gl{grid-column:1;padding:7px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;line-height:1.5;background:var(--card)}
.gl b{font-size:13.5px;font-weight:700}
.gl span{font-size:11.5px;color:var(--ink-3)}
.gl.phase b{font-weight:800}
.gl.ms{background:var(--card-2)}
.gb,.gm{border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;z-index:1}
.gb span{display:block;margin:9px 2px;width:100%;height:28px;line-height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--navy-3);background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--blue) 45%,transparent);white-space:nowrap;overflow:hidden}
.gb.key span{background:var(--blue);color:#fff;box-shadow:none}
.gm{justify-content:center}
.gm i{width:13px;height:13px;border-radius:50%;background:var(--apn);box-shadow:0 0 0 4px var(--apn-soft)}
.gantt > .gl.ms ~ .gm{background:transparent}
.g-today{grid-row:2 / -1;position:relative;pointer-events:none;z-index:2;display:flex;justify-content:center}
.g-today::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--blue);opacity:.75}
.g-today span{display:none}
.gate-legend{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gate-legend li{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md)}
.gate-legend li span{grid-column:2;font-size:13px;color:var(--ink-2)}
.gk{grid-row:span 2;width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff;background:var(--navy);transform:rotate(45deg);border-radius:4px}
.gk span{transform:rotate(-45deg);display:block}
.gate-legend li b{font-size:14px}

/* phases */
.phs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:ph}
.ph{border:1px solid var(--line);border-radius:var(--r-md);padding:18px;position:relative;background:var(--card)}
.ph.done{background:linear-gradient(180deg,var(--done-soft),var(--card) 70%)}
.ph.now{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.ph-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--ink-3)}
.ph-top .ic{width:20px;height:20px}
.ph-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--navy);color:#fff}
.pill{margin-inline-start:auto;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.now{background:var(--blue-soft);color:var(--blue)}
.pill.next{background:var(--apn-soft);color:var(--apn)}
.ph h3{font-size:15px;line-height:1.7;margin-bottom:10px}
.ph dl{margin:0;font-size:13.5px}
.ph dt{color:var(--ink-3);font-size:12px}
.ph dd{margin:0 0 6px;color:var(--ink-2)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.75}
.tbl th,.tbl td{text-align:right;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{background:var(--card-2);color:var(--ink-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.tbl tbody tr:last-child td,.tbl tbody tr:last-child th{border-bottom:0}
.tbl.num td{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl.num td:nth-child(2){white-space:normal;min-width:170px}
.tbl.num thead th{white-space:normal;vertical-align:bottom}
.tbl.num th,.tbl.num td{padding:10px 10px}
.tbl.ws td:first-child{min-width:260px}
.tbl.ws td:last-child{white-space:nowrap;color:var(--blue);font-weight:700}

/* decisions */
.sub-h{display:flex;gap:12px;margin:30px 0 14px;align-items:flex-start}
.sub-h > .ic{width:22px;height:22px;color:var(--blue);margin-top:4px}
.sub-h p{font-size:14px;color:var(--ink-2);margin-top:2px}
.decs{list-style:none;margin:0;padding:0;position:relative;display:grid;gap:10px}
.dec{display:flex;gap:16px;align-items:stretch;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.dec.internal{background:var(--card-2)}
.db{flex:0 0 62px;border-radius:10px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:6px 0}
.db b{font-size:22px;font-weight:900}
.db small{font-size:11px;color:#a9bcd6}
.db.tbd{background:var(--ware-soft);color:var(--ink-2)}
.db.tbd small{color:var(--ink-3)}
.dec-b{flex:1;min-width:0}
.dec-a{font-weight:600;font-size:14.5px;line-height:1.8}
.dec-m{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.dec-m span{display:inline-flex;align-items:center;gap:6px}
.dec-m .ic{color:var(--ink-3)}

/* workstreams */
.wss{display:grid;gap:10px}
.ws{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.ws.par{border-color:color-mix(in srgb,var(--apn) 55%,var(--line))}
.ws summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border-radius:var(--r-md)}
.ws summary::-webkit-details-marker{display:none}
.ws summary:hover{background:var(--card-2)}
.ws-ic{flex:0 0 38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.ws.par .ws-ic{background:var(--apn-soft);color:var(--apn)}
.ws-t{flex:1;display:flex;flex-direction:column;line-height:1.5}
.ws-t small{font-size:12px;color:var(--ink-3)}
.ws-t b{font-size:15.5px}
.ws-m{font-size:12.5px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);padding:2px 10px;border-radius:999px;white-space:nowrap}
.chev{width:10px;height:10px;border-left:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .2s;margin:0 4px 4px}
.ws[open] .chev{transform:rotate(135deg);margin-bottom:-4px}
.ws-body{padding:2px 16px 16px}
.ws-body p{color:var(--ink-2);margin-bottom:12px;font-size:14.5px}

/* tracking */
.rhs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rh{border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:8px}
.rh-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--done-soft);color:var(--done)}
.rh-f{font-size:17px;font-weight:800}
.rh p{font-size:14px;color:var(--ink-2);flex:1}
.rh-who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.esc-wrap{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
.esc-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.esc-h > .ic{width:22px;height:22px;color:var(--fail);margin-top:3px}
.esc-h p{font-size:13.5px;color:var(--ink-2)}
.esc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}
.es{display:flex;flex-direction:column;gap:10px}
.es-bar{height:calc(30px + var(--h) * .9);min-height:44px;border-radius:10px 10px 4px 4px;display:flex;align-items:flex-start;padding:8px 12px;color:#fff;font-weight:900;font-size:18px}
.es.s1 .es-bar{background:var(--apn);height:50px}
.es.s2 .es-bar{background:#e0702f;height:76px}
.es.s3 .es-bar{background:var(--fail);height:102px}
.es p{font-size:13.5px;color:var(--ink-2)}

/* kpis */
.kps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kp{border:1px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:6px;position:relative}
.kp.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.kp.main p{color:#b9c7da}
.kp.main .kp-ic{background:rgba(255,255,255,.1);color:#2fd0b4}
.kp.main .kp-t{background:#2fd0b4;color:var(--navy)}
.kp-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);margin-bottom:4px}
.kp b{font-size:16px}
.kp p{font-size:13.5px;color:var(--ink-2);flex:1}
.kp-t{align-self:flex-start;font-weight:800;font-size:13.5px;padding:3px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}

/* risks */
.rks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rk{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md)}
.rk-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--fail-soft);color:var(--fail)}
.rk-r b{display:block;font-size:14.5px;line-height:1.7}
.rk-r span{font-size:13px;color:var(--fail)}
.rk-m{display:flex;gap:8px;background:var(--done-soft);border-radius:10px;padding:10px 12px}
.rk-m .ic{color:var(--done);margin-top:5px}
.rk-m p{font-size:13.5px;color:var(--ink)}

/* raci */
.raci th[scope=row]{font-weight:700;background:var(--card);white-space:nowrap}
.raci td,.raci thead th{text-align:center}
.raci thead th:first-child{text-align:right}
.rc{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin:1px 2px;white-space:nowrap}
.rc.a{background:var(--blue);color:#fff}
.rc.r{background:var(--navy);color:#fff}
.rc.c{background:var(--apn-soft);color:#9a6512}
.rc.i{background:var(--ware-soft);color:var(--ink-2)}
@media (prefers-color-scheme:dark){.rc.c{color:var(--apn)}.rc.r{background:#2d4a76}}
.rc-n{color:var(--ink-3)}

/* actions */

.slow{margin:0;padding-right:20px;font-size:13.5px;color:var(--ink-2)}
.slow li{margin:4px 0}
@media (max-width:1020px){.cz-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .causes{padding:14px 12px}
  .cz-cards{grid-template-columns:minmax(0,1fr)}
  .nv li{grid-template-columns:100px minmax(0,1fr) 54px}
  .cz-ideal span{right:auto;left:0;width:auto;top:4px}
}
.cz-key{margin:0 0 14px}
.dash > .causes{margin-top:18px}

/* ===== patches ===== */
.patches{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-md);padding:20px;background:var(--card)}
.pt-ic{color:var(--blue)!important}
.pt-kpis{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pt-kpis li{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pt-kpis b{display:block;font-size:22px;font-weight:900;line-height:1.3}
.pt-kpis b small{font-size:12px;font-weight:600;color:var(--ink-3)}
.pt-kpis span{font-size:12.5px;color:var(--ink-2)}
.pt-kpis li.warn b{color:#c46a12}
.pfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pf{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;min-width:0}
.pf-h{display:flex;align-items:center;gap:10px}
.pf-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 44px}
.pf-h > div{display:flex;flex-direction:column;line-height:1.4;flex:1;min-width:0}
.pf-h b{font-size:15px;text-align:right;font-feature-settings:normal}
.pf-h > div span{font-size:12px;color:var(--ink-3);font-feature-settings:normal}
.pf-t{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pf-t code,.pt-from{font-family:inherit;font-feature-settings:normal}
.pf-t code{font-weight:800;color:var(--done);background:var(--done-soft);padding:1px 8px;border-radius:6px;margin-inline-start:4px}
.pf-s{font-size:12.5px;color:var(--ink-3);margin:8px 0 10px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.pts li{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px;padding:2px 0;position:relative}
.pts li.pts-h{font-size:11.5px;color:var(--ink-3);grid-template-columns:118px 1fr}
.pts li.pts-h span:last-child{text-align:left}
.pt-from{font-weight:700;text-align:left;white-space:nowrap}
.pt-from small{font-weight:500;color:var(--ink-3);margin-left:4px;font-size:10.5px}
.pt-bar{height:10px;background:var(--card-2);border-radius:5px;overflow:hidden;direction:rtl}
.pt-bar i{display:block;height:100%;background:var(--blue);border-radius:5px;opacity:.75}
.pts li b{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts li b small{font-weight:500;color:var(--ink-3);font-feature-settings:normal}
.pt-dup{grid-column:1 / -1;justify-self:end;font-size:10.5px;color:#c46a12;background:var(--apn-soft);padding:0 8px;border-radius:99px;margin-top:-2px}
.pt-leg{margin-top:12px;border:1px solid var(--line);border-radius:10px}
.pt-leg summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:700}
.pt-leg summary::-webkit-details-marker{display:none}
.pt-leg summary .chev{margin-inline-start:auto}
.pt-leg[open] .chev{transform:rotate(135deg);margin-bottom:-4px}
.pt-leg ul{list-style:none;margin:0;padding:0 14px 12px;display:grid;gap:4px}
.pt-leg li{display:grid;grid-template-columns:1fr 80px 100px;gap:8px;font-size:12.5px;color:var(--ink-2)}
.pt-leg li span:first-child{font-feature-settings:normal;text-align:right}
.pt-leg li .dt{text-align:left;color:var(--ink-3);font-feature-settings:normal}
.pt-note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.pt-note .ic{color:#c46a12;margin-top:4px}
@media (max-width:1020px){.pfs{grid-template-columns:minmax(0,1fr)}.pt-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.patches{padding:14px 12px}.pt-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pts li{grid-template-columns:104px minmax(0,1fr) 58px}.pt-leg li{grid-template-columns:1fr 64px}.pt-leg li .dt{display:none}}

/* ===== per-PSP view ===== */
.psp-view .fg-psp,.psp-view #dReset{display:none}
.psp-view .chart:has(#cPsp){display:none}
.psp-view .charts{grid-template-columns:minmax(0,1fr)}
.cz-cards.one{grid-template-columns:minmax(0,1fr);margin-bottom:4px}
</style>
<style>
.gate-page{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/22px 22px,
  radial-gradient(900px 420px at 85% -10%,#24508f 0%,transparent 60%),
  linear-gradient(180deg,#10223a 0%,#0d1c31 100%)}
.gate-card{width:100%;max-width:400px;background:var(--card);color:var(--ink);border-radius:20px;padding:30px 28px 24px;box-shadow:0 30px 70px rgba(3,9,20,.45)}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.gate-brand .ic{width:40px;height:40px;padding:8px;border-radius:11px;background:linear-gradient(135deg,#2b62e0,#0e9f8a);color:#fff}
.gate-brand b{display:block;font-size:17px;font-weight:800;line-height:1.5}
.gate-brand span{font-size:13px;color:var(--ink-3)}
.gate-card h1{font-size:20px;font-weight:800;margin:0 0 4px}
.gate-card > p{font-size:13.5px;color:var(--ink-2);margin:0 0 20px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.fld input{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);direction:ltr;text-align:left;transition:border-color .15s}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);cursor:pointer;padding:6px;border-radius:8px;display:grid}
.go{width:100%;font:inherit;font-size:15px;font-weight:800;padding:12px;border:0;border-radius:11px;background:var(--blue);color:#fff;cursor:pointer;margin-top:4px;display:flex;justify-content:center;align-items:center;gap:8px}
.go:disabled{opacity:.7;cursor:wait}
.err{min-height:22px;margin:10px 0 0;font-size:13px;color:var(--fail);font-weight:600}
.gate-foot{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:none}
.go:disabled .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.who-chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.who-chip span{color:#dbe5f2;font-size:13px}
.logout{font:inherit;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;cursor:pointer}
.logout:hover{background:rgba(255,255,255,.2)}
@media (max-width:760px){.who-chip span{display:none}}
</style>
</head>

<div class="gate-page">
  <form class="gate-card" id="gate" autocomplete="on">
    <div class="gate-brand">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>
      <div><b>اکشن‌پلن آپدیت دستگاه‌ها</b><span>برنامه ارتقای نسخه FW کارتخوان‌ها</span></div>
    </div>
    <h1>ورود</h1>
    <p>با نام کاربری و رمز عبوری که برای شرکت شما ارسال شده وارد شوید.</p>
    <label class="fld"><span>نام کاربری</span><input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="fld"><span>رمز عبور</span><div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="eye" aria-label="نمایش رمز عبور"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label>
    <button class="go" id="go" type="submit"><i class="spin" aria-hidden="true"></i><span>ورود</span></button>
    <p class="err" id="err" role="alert"></p>
    <div class="gate-foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>هر شرکت فقط داده‌های خودش را می‌بیند.</div>
  </form>
</div>

    try { var v = await unlock(u, p); ss('ttu', u); ss('ttp', p); mount(v); }
    catch (x) {
      go.disabled = false;
      err.textContent = x.message === 'browser'
        ? 'این مرورگر قدیمی است. لطفاً با نسخه جدید Chrome، Edge، Firefox یا Safari باز کنید.'
        : 'نام کاربری یا رمز عبور درست نیست.';
    }
  });
  var su = ss('ttu'), sp = ss('ttp');
  if (su && sp) { $('u').value = su; go.disabled = true;
    unlock(su, sp).then(mount).catch(function(){ go.disabled = false; ss('ttu', null); ss('ttp', null); }); }
})();
</script>
</body>
